services:
  backend:
    build: ./backend
    container_name: cargo_camp_backend
    restart: always
    network_mode: "host"
    env_file:
      - ./backend/.env
    environment:
      CONTRACTS_DIR: /data/contracts
      PRIVATE_DOCUMENTS_DIR: /data/private-documents

    volumes:
      - ./uploads:/app/uploads
      - /var/lib/cargocamp/contracts:/data/contracts
      - /root/cargocamp-secrets/firebase-service-account.json:/app/secrets/firebase-service-account.json:ro
      - /var/lib/cargocamp/private-documents:/data/private-documents
    command: ["npm", "start"]

  frontend:
    build: ./frontend
    container_name: cargo_camp_frontend
    restart: always
    ports:
      - "3001:80"
    env_file:
      - ./frontend/.env
    environment:
      REACT_APP_API_URL: http://localhost:5001
      REACT_APP_SOCKET_URL: http://localhost:5001
    networks:
      - cargo_camp_net

  admin-panel:
    build: ./admin-panel
    container_name: cargo_camp_admin-panel
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - ./admin-panel/.env
    environment:
      REACT_APP_API_URL: http://localhost:5001
      REACT_APP_SOCKET_URL: http://localhost:5001
    networks:
      - cargo_camp_net

networks:
  cargo_camp_net:
    driver: bridge
