version: "3.8"

services:
  db:
    build: ./Database
    container_name: cargo_camp_db
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cargo_camp
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: cargo_camp_backend
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - db
    env_file:
      - .env

  frontend:
    build: ./frontend
    container_name: cargo_camp_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

  admin-panel:
    build: ./admin-panel
    container_name: cargo_camp_admin-panel
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  mysql_data: