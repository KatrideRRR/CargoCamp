version: "3.8"

services:
  db:
    build: ./Database
    container_name: cargo_camp_db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cargo_camp
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: cargo_camp_backend
    restart: always
    ports:
      - "5001:5001"
    depends_on:
      - db
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
    command: ["/wait-for-it.sh", "db:3306", "--", "npm", "start"]

  frontend:
    build: ./frontend
    container_name: cargo_camp_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    environment:
      REACT_APP_API_URL: backend:5001
      REACT_APP_SOCKET_URL: backend:5001

  admin-panel:
    build: ./admin-panel
    container_name: cargo_camp_admin-panel
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - backend
    env_file:
      - ./admin-panel/.env
    environment:
      REACT_APP_API_URL: backend:5001
      REACT_APP_SOCKET_URL: backend:5001

volumes:
  mysql_data: